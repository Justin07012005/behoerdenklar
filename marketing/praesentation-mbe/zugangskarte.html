<!DOCTYPE html>
<!--
  Zugangskarte 15 × 10 cm (Querformat) für den Beratungs-PC, als Fotodruck (z. B. dm-Fototheke).
  Der Code kommt aus code.local.js (nicht im Git, das Repository ist öffentlich).
  Bild in 300 dpi (im Ordner marketing/praesentation-mbe):
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
    --allow-file-access-from-files --hide-scrollbars --window-size=567,378 --force-device-scale-factor=3.125 \
    --screenshot=druck/zugangskarte.png "file://$PWD/zugangskarte.html"
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Zugangskarte BehördenKlar</title>
<script src="../../webseite/qrcode.js"></script>
<script src="code.local.js"></script>
<style>
  :root { --papier: #faf7f0; --tinte: #21211d; --grau: #6b675e; --amtsblau: #1d4e89; --rot: #b3372b; --marker: #ffe66b; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 567px; height: 378px; overflow: hidden; }
  body { font-family: Georgia, 'Times New Roman', serif; color: var(--tinte); background: var(--papier); }
  .karte { position: relative; width: 567px; height: 378px; padding: 26px 30px 22px; }
  .kopf { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2.2px solid var(--tinte); padding-bottom: 7px; }
  .absender { font-weight: 700; font-size: 17px; }
  .absender small { font-weight: 400; font-size: 10px; opacity: .6; letter-spacing: .04em; }
  .az { font-family: 'Courier New', monospace; font-size: 9.5px; color: var(--grau); letter-spacing: .06em; text-transform: uppercase; }
  .haupt { display: grid; grid-template-columns: 1fr 128px; gap: 22px; margin-top: 18px; align-items: start; }
  .label { font-family: 'Courier New', monospace; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--grau); }
  h1 { font-size: 30px; line-height: 1.05; margin-top: 4px; }
  .markiert { background: linear-gradient(104deg, transparent 2%, var(--marker) 4%, var(--marker) 96%, transparent 98%); padding: 0 5px; }
  .stelle { font-size: 15px; margin-top: 6px; }
  .code { display: inline-block; margin-top: 14px; font-family: 'Courier New', monospace; font-weight: 700; font-size: 31px;
          letter-spacing: .08em; background: var(--marker); padding: 2px 10px; border: 2px solid var(--tinte); box-shadow: 4px 4px 0 var(--tinte); }
  .adresse { margin-top: 13px; font-family: 'Courier New', monospace; font-weight: 700; font-size: 12.5px; color: var(--amtsblau); }
  .tipp { font-size: 11px; color: var(--grau); margin-top: 2px; }
  #qr { width: 128px; height: 128px; background: #fff; padding: 7px; border: 2px solid var(--tinte); }
  #qr svg { width: 100%; height: 100%; display: block; }
  .qrtext { font-size: 9.5px; color: var(--grau); text-align: center; margin-top: 5px; line-height: 1.3; }
  .fuss { position: absolute; left: 30px; right: 30px; bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end;
          border-top: 1px solid rgba(33,33,29,.3); padding-top: 7px; font-size: 11px; }
  .fuss b { font-size: 12px; }
  .stempel { display: inline-block; padding: 3px 8px; border: 2px solid var(--rot); color: var(--rot); font-family: 'Courier New', monospace;
             font-weight: 700; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; transform: rotate(-4deg); }
</style>
</head>
<body>
<div class="karte">
  <div class="kopf">
    <span class="absender">📬 BehördenKlar <small>by Webklar</small></span>
    <span class="az">1 Monat · bis 100 Briefe · kostenlos</span>
  </div>

  <div class="haupt">
    <div>
      <p class="label">Ihr Testzugang</p>
      <h1><span class="markiert">Briefe verstehen,</span><br>in 27 Sprachen.</h1>
      <p class="stelle">MBE Donnersberg · gültig bis 29.11.2026</p>
      <span class="code" id="codeText"></span>
      <p class="adresse" id="adresseText"></p>
      <p class="tipp">Als Lesezeichen am Beratungs-PC speichern.</p>
    </div>
    <div>
      <div id="qr"></div>
      <p class="qrtext">Zum Ausprobieren<br>mit dem Handy scannen</p>
    </div>
  </div>

  <div class="fuss">
    <span>Fragen? <b>Justin Klein · 0170 4969375</b></span>
    <span class="stempel">Nur für Mitarbeitende</span>
  </div>
</div>
<script>
  var CODE = window.BK_EINRICHTUNGS_CODE || '';
  var url = CODE ? 'https://behoerdenklar.de/demo?code=' + CODE : 'https://behoerdenklar.de/demo';
  var qr = qrcode(0, 'M'); qr.addData(url); qr.make();
  document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  document.getElementById('codeText').textContent = CODE || 'CODE';
  document.getElementById('adresseText').textContent = url.replace('https://', '');
</script>
</body>
</html>
